name: Fetch Unity APK

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/fetch-unity-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fetch-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Prepare
        run: |
          mkdir -p out
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null 2>&1

      - name: Download APK from Unity public share
        env:
          UNITY_SHARE_URL: "https://cloud.unity.com/public-share/build-automation/share?shareId=2MKKRmd01iCmzybWQfODs6v4CH1xo6W7PDsbow1O4nw"
        run: |
          cat > fetch-apk.js <<'JS'
          const { chromium } = require('playwright');
          const fs = require('fs');

          (async () => {
            const browser = await chromium.launch({ headless: true });
            const page = await browser.newPage({ acceptDownloads: true });
            page.setDefaultTimeout(30000);

            console.log('Opening Unity share page...');
            await page.goto(process.env.UNITY_SHARE_URL, { waitUntil: 'domcontentloaded', timeout: 60000 });
            await page.waitForTimeout(5000);

            console.log('Title:', await page.title());
            console.log('URL:', page.url());

            const body = (await page.locator('body').innerText()).slice(0, 5000);
            console.log('BODY_START\n' + body + '\nBODY_END');
            fs.writeFileSync('out/share-page.txt', body);
            await page.screenshot({ path: 'out/share-page.png', fullPage: true });

            const candidates = [
              page.getByRole('button', { name: /download.*apk/i }),
              page.getByRole('link', { name: /download.*apk/i }),
              page.getByRole('button', { name: /download/i }),
              page.getByRole('link', { name: /download/i }),
              page.locator('a[href*=".apk" i]'),
              page.locator('a[href*="download" i]')
            ];

            let clicked = false;
            for (const locator of candidates) {
              const count = await locator.count().catch(() => 0);
              if (!count) continue;
              console.log('Candidate count:', count);
              for (let i = 0; i < count; i++) {
                const item = locator.nth(i);
                if (!(await item.isVisible().catch(() => false))) continue;
                const txt = await item.innerText().catch(() => '');
                const href = await item.getAttribute('href').catch(() => null);
                console.log('Trying candidate:', txt, href || '');
                try {
                  const downloadPromise = page.waitForEvent('download', { timeout: 20000 });
                  await item.click();
                  const download = await downloadPromise;
                  const suggested = download.suggestedFilename();
                  const target = 'out/' + (suggested.toLowerCase().endsWith('.apk') ? suggested : 'ChemistryLab3D-Android.apk');
                  await download.saveAs(target);
                  console.log('Saved download to', target);
                  clicked = true;
                  break;
                } catch (e) {
                  console.log('Candidate did not produce download:', e.message);
                }
              }
              if (clicked) break;
            }

            if (!clicked) {
              const links = await page.locator('a').evaluateAll(as => as.map(a => ({text:(a.innerText||'').trim(), href:a.href})));
              fs.writeFileSync('out/links.json', JSON.stringify(links, null, 2));
              console.log('No direct download event. Links saved for inspection.');
              throw new Error('Could not locate/capture APK download');
            }

            const apks = fs.readdirSync('out').filter(f => f.toLowerCase().endsWith('.apk'));
            if (!apks.length) throw new Error('No APK file in out directory');
            for (const f of apks) {
              console.log('APK:', f, fs.statSync('out/' + f).size, 'bytes');
            }
            await browser.close();
          })().catch(async e => {
            console.error(e);
            process.exit(1);
          });
          JS
          node fetch-apk.js

      - name: Upload APK artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Unity-APK-download
          path: out/
          if-no-files-found: warn
          retention-days: 3
